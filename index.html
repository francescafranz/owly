<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/scss/style.scss">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <title>Owly</title>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="header-top">
          <img class="logo" src="./src/assets/img/svg/white-logo-books.svg" alt="Owly books">
        </div>
        <div class="header-content">
          <h1>Trova nuovi libri da leggere!</h1>
          <p>Cerca per categoria:</p> 
          <form id="search-form" class="search-box">
            <button type="submit" class="search-icon" aria-label="Cerca">
              <img src="./src/assets/img/svg/Search icon.svg" alt="">
            </button>
            <input
            id="subject-input"
            type="search"
            placeholder="Es. thriller, fantasy, avventura..."
            />
            <button class="button-primary" type="submit">Cerca</button>
          </form> 
        </div>
      </header>

      <section id="results"></section>
      <footer>
        <div>
          <img class="logo" src="./src/assets/img/svg/white-logo-books.svg" alt="Owly books"> 
        </div>
        <div class="footer-text">
          <p>Final project JavaScript Advanced</p>
          <p>Developed and Designed by Francesca Franz</p>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
