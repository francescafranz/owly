<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="stylesheet" href="/src/scss/style.scss">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <title>Owly</title>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="header-top">
          <img class="header-logo" src="./src/assets/img/svg/white-logo-books.svg" alt="Owly books">
        </div>
        <div class="header-content">
          <h1>Trova nuovi libri da leggere!</h1>
          <p>Cerca per categoria e scegli tra più titoli in diverse lingue</p> 
          <form id="search-form" class="search-box">
            <img class="search-icon" src="./src/assets/img/svg/Search icon.svg" alt="Cerca">
            <input
            id="subject-input"
            type="text"
            placeholder="Es. thriller, fantasy, avventura..."
            />
            <button type="submit">Cerca</button>
          </form> 
        </div>
      </header>

      <section id="results"></section>
      <footer>
        <div class="footer-logo">
          <img src="./src/assets/img/svg/white-logo-books.svg" alt="Owly books"> <!--32px*132px-->
        </div>
        <p class="footer-text">Final project JavaScript Advanced - Developed and Designed by Francesca Franz</p>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
